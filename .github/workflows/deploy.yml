# Deploys the Worker. See docs/adr/0001-deploys-with-github-actions.md.
#
# - A push to main that passes CI deploys to staging (kinmeet-staging).
# - A published release deploys to live (kinmeet-live), but only after Matt
#   approves the run in the GitHub environment `live`, and only if CI passed
#   on the release's commit and that commit is on main.
#
# The Cloudflare API token is an environment secret, so only jobs that run in
# the `staging` or `live` environments can read it. Pull request runs cannot.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  # Not a secret. The Kinmeet account is the only account we deploy to.
  CLOUDFLARE_ACCOUNT_ID: 0fa695ccf43f64b3eb9fae94520109b4

jobs:
  staging:
    name: Deploy to staging
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://kinmeet-staging.kinmeet.workers.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        run: scripts/d1-migrate.sh staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the deployed site
        run: scripts/check-deployed.sh https://kinmeet-staging.kinmeet.workers.dev

  live:
    name: Deploy to live
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    environment:
      # Matt is the required reviewer for this environment.
      name: live
      url: https://kinmeet-live.kinmeet.workers.dev
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release commit is on main and passed CI
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Release commit $sha is not on main."; exit 1; }
          passed="$(gh run list --workflow CI --commit "$sha" --branch main --event push \
            --status success --json databaseId --jq 'length')"
          [ "$passed" -gt 0 ] \
            || { echo "::error::CI has not passed on main for $sha."; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        run: scripts/d1-migrate.sh live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy
        run: npx wrangler deploy --env live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the deployed site
        run: scripts/check-deployed.sh https://kinmeet-live.kinmeet.workers.dev
