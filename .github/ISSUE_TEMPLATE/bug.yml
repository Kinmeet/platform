name: Bug
description: Something on the platform does not work as it should
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Never include personal data, screenshots of real people's details, secrets or safeguarding details. For a security problem, contact the maintainers privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: Page, steps and browser.
